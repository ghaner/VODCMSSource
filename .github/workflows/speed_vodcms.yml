name: ZY‑Player风格点播源测速(按延迟升序)
on:
  schedule:
    # UTC周五16点 = 北京时间周六00:00
    - cron: '0 16 * * 5'
  workflow_dispatch:
jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装工具 jq curl libxml2-utils
        run: sudo apt update && sudo apt install -y jq curl libxml2-utils
      - name: 2.1 VODCMSXML.json格式化｜api链接去重输出VODCMSXMLcs.json
        run: |
          INPUT_RAW="VODCMSXML.json"
          TMP_CS="VODCMSXMLcs.json"
          rm -f "$TMP_CS"
          jq '
            # 归一化api：移除url末尾多余斜杠，消除末尾 / 和无/ 的字符串差异，用于正确去重
            map(.api |= ( if type=="string" then sub("/+$";"") else . end ))
            | reduce .[] as $item (
              [];
              if any(.[]; .api == $item.api) then . else . + [$item] end
            )
          ' "$INPUT_RAW" > "$TMP_CS"
          total_input=$(jq 'length' "$TMP_CS")
          echo "【2.1格式化完成】去重后源总数：${total_input}，输出临时文件：${TMP_CS}"
      - name: 2.2 测速模块｜读取VODCMSXMLcs.json，测速成功输出VODCMSXMLyx.json
        run: |
          TMP_CS="VODCMSXMLcs.json"
          TMP_JSONL="speed_ok.tmp.jsonl"
          TMP_YX_RAW="VODCMSXMLyx.json"
          RESP_TMP="resp.tmp.raw"
          rm -f "$TMP_JSONL" "$TMP_YX_RAW" "$RESP_TMP"
          jq -c '.[]' "$TMP_CS" | while read -r item; do
              api_url=$(echo "$item" | jq -r '.api')
              src_name=$(echo "$item" | jq -r '.name')
              src_id=$(echo "$item" | jq -r '.id')
              rm -f "$RESP_TMP"
              if [[ -z "$api_url" || "$api_url" == "null" ]];then
                echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
                continue
              fi
              # GET请求、跟随重定向、5s超时，保存完整响应体
              result=$(curl -s -X GET -L -m 5 -o "$RESP_TMP" -w "%{http_code} %{time_total}" "$api_url" || echo "000 5.0")
              resp_code=$(echo "$result" | awk '{print $1}')
              time_total=$(echo "$result" | awk '{print $2}')
              latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')
              # 网络层失败
              if [[ "$resp_code" == "000" ]];then
                echo "❌[网络失败] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                continue
              fi
              if [[ ! "$resp_code" =~ ^(200|301|302)$ ]];then
                echo "❌[HTTP异常 ${resp_code}] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi
              # 返回HTML页面直接判定解析失败（风控、验证码、网页）
              if grep -iq "<html" "$RESP_TMP";then
                echo "❌[解析失败：返回HTML风控页面] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi
              # 不依赖MIME，优先尝试XML，失败尝试JSON，任一解析成功即有效
              is_valid_content=0
              if xmllint --noout "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              elif jq empty "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              fi
              if [[ $is_valid_content -eq 1 ]];then
                echo "✅[可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                # 输出单行jsonl，只追加latency_ms，字段完全继承原始源
                echo "$item" | jq -c --argjson lat "$latency_ms" '. + {latency_ms:$lat}' >> "$TMP_JSONL"
              else
                echo "❌[解析失败：返回非点播XML/JSON数据] id:${src_id} ${src_name} latency:${latency_ms}ms"
              fi
          done
          # jsonl转标准JSON数组，输出VODCMSXMLyx.json，结构与VODCMSXML.json完全一致
          jq -s '.' "$TMP_JSONL" > "$TMP_YX_RAW"
          valid_raw=$(jq 'length' "$TMP_YX_RAW")
          echo "【2.2测速模块完成】测速成功源数量：${valid_raw}，临时输出：${TMP_YX_RAW}"
          rm -f "$TMP_JSONL"

      - name: 2.2‑extra 白名单Chrome‑UA专项测速｜追加成功源至VODCMSXMLyx.json
        run: |
          TMP_RAW="VODCMSXML.json"
          OUT_MAIN="VODCMSXMLyx.json"
          CHROME_TMP_JSONL="chrome_ok.tmp.jsonl"
          RESP_CHROME="resp_chrome.tmp.raw"
          WHITELIST_FILE="./Chrome‑UAXML.txt"
          CHROME_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          rm -f "${CHROME_TMP_JSONL}" "${RESP_CHROME}"
          touch "${CHROME_TMP_JSONL}"

          if [[ ! -f "${WHITELIST_FILE}" ]];then
            echo "ℹ️ Chrome‑UAXML.txt 文件不存在，跳过Chrome‑UA专项测速"
            exit 0
          fi

          WHITELIST_API=()
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            clean_line=$(echo "$line" | sed 's:/*$::')
            WHITELIST_API+=("$clean_line")
          done < "${WHITELIST_FILE}"

          for target_api in "${WHITELIST_API[@]}"; do
            item=$(jq -c --arg api "${target_api}" '.[] | select( (.api | sub("/+$";"")) == $api )' "${TMP_RAW}")
            if [[ -z "${item}" ]];then
              echo "⚠️白名单api【${target_api}】在VODCMSXML.json中找不到源记录，跳过"
              continue
            fi
            api_url=$(echo "$item" | jq -r '.api')
            src_name=$(echo "$item" | jq -r '.name')
            src_id=$(echo "$item" | jq -r '.id')
            rm -f "${RESP_CHROME}"

            # 超时由5s上调到8s，改善海外网络超时
            result=$(curl -s -X GET -L -m 8 -o "${RESP_CHROME}" -w "%{http_code} %{time_total}" -A "${CHROME_UA}" "${api_url}" || echo "000 8.0")
            resp_code=$(echo "$result" | awk '{print $1}')
            time_total=$(echo "$result" | awk '{print $2}')
            latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')

            if [[ "${resp_code}" == "000" ]];then
              echo "❌[ChromeUA网络失败] id:${src_id} ${src_name} | ${api_url}"
              continue
            fi
            if [[ ! "${resp_code}" =~ ^(200|301|302)$ ]];then
              echo "❌[ChromeUA HTTP异常 ${resp_code}] id:${src_id} ${src_name} | ${api_url}"
              continue
            fi
            if grep -iq "<html" "${RESP_CHROME}" || [[ ! -s "${RESP_CHROME}" ]];then
              echo "❌[ChromeUA返回HTML风控/空响应] id:${src_id} ${src_name} | ${api_url}"
              continue
            fi

            is_valid_content=0
            if xmllint --noout "${RESP_CHROME}" 2>/dev/null;then
                is_valid_content=1
            elif jq empty "${RESP_CHROME}" 2>/dev/null;then
                is_valid_content=1
            fi

            if [[ $is_valid_content -eq 1 ]];then
              echo "✅[Chrome‑UA专项测速可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
              line=$(echo "$item" | jq -c --argjson lat "${latency_ms}" '. + {latency_ms:$lat}' 2>/dev/null)
              if [[ $? -eq 0 && -n "${line}" ]];then
                echo "${line}" >> "${CHROME_TMP_JSONL}"
              fi
            else
              echo "❌[ChromeUA解析失败，非点播XML/JSON] id:${src_id} ${src_name} | ${api_url}"
            fi
          done

          if [[ -s "${CHROME_TMP_JSONL}" ]];then
            jq -s '($[0] + $[1])' "${OUT_MAIN}" <(jq -s '.' "${CHROME_TMP_JSONL}") > tmp_merge.json
            mv tmp_merge.json "${OUT_MAIN}"
            chrome_ok_cnt=$(jq 'length' "${CHROME_TMP_JSONL}")
            total_after_merge=$(jq 'length' "${OUT_MAIN}")
            echo "【2.2‑extra合并完成】Chrome‑UA测速成功${chrome_ok_cnt}条；VODCMSXMLyx.json总源数：${total_after_merge}"
          else
            echo "ℹ️Chrome‑UA专项测速无可用源，不做合并"
          fi
          rm -f "${CHROME_TMP_JSONL}" "${RESP_CHROME}"

      - name: 2.3 测速结果处理｜重命名name、排序、分配id、字段赋值，输出VODCMSXML‑YZ.json
        run: |
          TMP_YX_RAW="VODCMSXMLyx.json"
          OUTPUT="VODCMSXML-YZ.json"
          rm -f "$OUTPUT"
          jq '
            # 2.3.1 点播源数组按照测速延迟升序排列
            sort_by(.latency_ms)
            # 预提取云播组延迟最小对象
            | map(select(.group=="云播")) as $yunGroup
            | ($yunGroup | if length>0 then sort_by(.latency_ms)[0] else null end) as $yunMinObj
            # 2.3.2 name相同、api不同，name追加二级域名主体不带后缀
            | group_by(.name)
            | map(
                . as $grp
                | ($grp | map(.api)|unique|length) as $apiCnt
                | if $apiCnt <= 1 then
                    $grp
                  else
                    $grp | map(
                      .api as $apiStr
                      | if ($apiStr | type) != "string" then .
                      else
                        ($apiStr | capture("^https?://(?<host>[^/]+)").host?) as $h
                        | ($h | split(".")) as $parts
                        | if ($parts | length) >= 2 then
                            .name = "\(.name)-\($parts[-2])"
                          else
                            .name = "\(.name)-unknown"
                          end
                      end
                    )
                  end
              )
            | flatten
            # 统一状态字段
            | map(.isActive = true | .status = "可用")
            # 云播最小源置顶；其余保留测速升序排在后面；无云播则维持原排序
            | if $yunMinObj != null then
                [ $yunMinObj ] + ( . | map(select(.api != $yunMinObj.api)) )
              else
                .
              end
            # 分配id：置顶项id=1，往下依次2,3,4…，删除latency_ms
            | to_entries
            | map( .value + {id:(.key + 1)} | del(.latency_ms) )
          ' "$TMP_YX_RAW" > "$OUTPUT"
          final_count=$(jq 'length' "$OUTPUT")
          echo "【2.3结果处理完成】最终可用源数量: ${final_count}，输出：${OUTPUT}"
          # 清理全部临时文件
          rm -f VODCMSXMLcs.json VODCMSXMLyx.json resp.tmp.raw
      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v11
        with:
          add: VODCMSXML-YZ.json
          message: "🤖ZY‑Player风格测速更新VODCMSXML‑YZ.json $(date '+%Y‑%m‑%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com
          pull: true