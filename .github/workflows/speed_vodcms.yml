name: VODCMS点播源测速
on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行点播源测速脚本
        run: python speed_vodcms.py

      - name: 提交更新文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add VODCMSXML-YZ.json
          git commit -m "🤖 自动测速更新 VODCMSXML-YZ.json $(date +'%Y-%m-%d %H:%M')" || echo "无变更无需提交"
          git push