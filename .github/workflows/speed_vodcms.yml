name: ZY‑Player风格点播源测速(按延迟升序)
on:
  schedule:
    # UTC周五16点 = 北京时间周六00:00
    - cron: '0 16 * * 5'
  workflow_dispatch:
jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装工具 jq curl libxml2-utils
        run: sudo apt update && sudo apt install -y jq curl libxml2-utils

      - name: 2.1 VODCMSXML.json格式化｜api链接去重输出VODCMSXMLcs.json
        run: |
          INPUT_RAW="VODCMSXML.json"
          TMP_CS="VODCMSXMLcs.json"
          rm -f "$TMP_CS"
          # 2.1.1 api链接去重，保留数组首次出现条目，输出保持原格式到VODCMSXMLcs.json
          jq '
            reduce .[] as $item (
              [];
              if any(.[]; .api == $item.api) then . else . + [$item] end
            )
          ' "$INPUT_RAW" > "$TMP_CS"
          total_input=$(jq 'length' "$TMP_CS")
          echo "【2.1格式化完成】去重后源总数：${total_input}，输出临时文件：${TMP_CS}"

      - name: 2.2 测速模块｜读取VODCMSXMLcs.json，测速成功输出VODCMSXMLyx.json
        run: |
          TMP_CS="VODCMSXMLcs.json"
          TMP_YX_RAW="VODCMSXMLyx.json"
          RESP_TMP="resp.tmp.raw"
          rm -f "$TMP_YX_RAW" "$RESP_TMP"
          # 输出json数组开头
          echo "[" > "$TMP_YX_RAW"
          first_item=1

          jq -c '.[]' "$TMP_CS" | while read -r item; do
              api_url=$(echo "$item" | jq -r '.api')
              src_name=$(echo "$item" | jq -r '.name')
              src_id=$(echo "$item" | jq -r '.id')
              rm -f "$RESP_TMP"
              if [[ -z "$api_url" || "$api_url" == "null" ]];then
                echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
                continue
              fi
              # GET请求、跟随重定向、5s超时，保存完整响应体
              result=$(curl -s -X GET -L -m 5 -o "$RESP_TMP" -w "%{http_code} %{time_total}" "$api_url" || echo "000 5.0")
              resp_code=$(echo "$result" | awk '{print $1}')
              time_total=$(echo "$result" | awk '{print $2}')
              latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')
              # 网络层失败
              if [[ "$resp_code" == "000" ]];then
                echo "❌[网络失败] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                continue
              fi
              if [[ ! "$resp_code" =~ ^(200|301|302)$ ]];then
                echo "❌[HTTP异常 ${resp_code}] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi
              # 返回HTML页面直接判定解析失败（风控、验证码、网页）
              if grep -iq "<html" "$RESP_TMP";then
                echo "❌[解析失败：返回HTML风控页面] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi
              # 不依赖MIME，优先尝试XML，失败尝试JSON，任一解析成功即有效
              is_valid_content=0
              if xmllint --noout "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              elif jq empty "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              fi
              if [[ $is_valid_content -eq 1 ]];then
                echo "✅[可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                # 追加latency_ms字段，写入VODCMSXMLyx.json数组
                if [[ $first_item -eq 0 ]]; then
                  echo "," >> "$TMP_YX_RAW"
                fi
                echo "$item" | jq --argjson lat "$latency_ms" '. + {latency_ms:$lat}' >> "$TMP_YX_RAW"
                first_item=0
              else
                echo "❌[解析失败：返回非点播XML/JSON数据] id:${src_id} ${src_name} latency:${latency_ms}ms"
              fi
          done
          # 闭合json数组
          echo "]" >> "$TMP_YX_RAW"
          valid_raw=$(jq 'length' "$TMP_YX_RAW")
          echo "【2.2测速模块完成】测速成功源数量：${valid_raw}，临时输出：${TMP_YX_RAW}"

      - name: 2.3 测速结果处理｜重命名name、排序、分配id、字段赋值，输出VODCMSXML‑YZ.json
        run: |
          TMP_YX_RAW="VODCMSXMLyx.json"
          OUTPUT="VODCMSXML-YZ.json"
          rm -f "$OUTPUT"
          jq '
            . as $all
            # 2.3.1 整体先按测速延迟升序排列
            | sort_by(.latency_ms)
            # 2.3.2 name相同api不同 → name追加二级域名主体(不带后缀)
            | group_by(.name)
            | map(
                . as $grp
                | ($grp | map(.api)|unique|length) as $apiCnt
                | if $apiCnt <= 1 then
                    $grp
                  else
                    $grp | map(
                      (.api | type) as $t
                      | if $t != "string" then .
                      else
                        (.api | capture("^https?://(?<host>[^/]+)") | .host // null) as $h
                        | ($h | split(".") ) as $parts
                        # 提取二级域名主体，去掉后缀；不足则为unknown
                        | ($parts | length >=2 ? $parts[-2] : "unknown") as $secHost
                        | .name = "\(.name)-\($secHost)"
                      end
                    )
                  end
              )
            | flatten
            # 2.3.3：云播group取延迟最小，设置id=1；其余按延迟升序序号+1
            | ( map(select(.group=="云播")) | if length>0 then sort_by(.latency_ms)[0] else null end ) as $yunMinItem
            | . as $afterRename
            | if ($yunMinItem != null) then
                # 把云播最小延迟项放数组首位
                [$yunMinItem] + ($afterRename | map(select(.id != $yunMinItem.id)))
              else
                $afterRename
              end
            # 2.3.4 2.3.5 统一字段
            | map(
                .isActive = true
                | .status = "可用"
                | del(.latency_ms)
              )
            # 重分配id，数组索引从0开始 → id = key+1；云播最小项在0位自动得到id=1
            | to_entries
            | map(.value + {id:(.key + 1)})
          ' "$TMP_YX_RAW" > "$OUTPUT"

          final_count=$(jq 'length' "$OUTPUT")
          echo "【2.3结果处理完成】最终可用源数量: ${final_count}，输出：${OUTPUT}"
          # 清理临时文件
          rm -f VODCMSXMLcs.json VODCMSXMLyx.json resp.tmp.raw

      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v11
        with:
          add: VODCMSXML-YZ.json
          message: "🤖ZY‑Player风格测速更新VODCMSXML‑YZ.json $(date '+%Y‑%m‑%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com
          pull: true