name: 点播源API可用性测速
on:
  schedule:
    # cron UTC时间: 北京时间周六0点 = UTC周五16点
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装工具 jq curl
        run: sudo apt update && sudo apt install -y jq curl

      - name: API测速处理
        run: |
          INPUT="VODCMSXML.json"
          OUTPUT="VODCMSXML-YZ.json"
          TMP_VALID=valid.tmp.jsonl
          rm -f "$TMP_VALID" "$OUTPUT"

          # 读取顶层数组每一个对象
          total=$(jq 'length' "$INPUT")
          echo "总源数量: $total"

          jq -c '.[]' "$INPUT" | while read -r item; do
              api_url=$(echo "$item" | jq -r '.api')
              src_name=$(echo "$item" | jq -r '.name')
              src_id=$(echo "$item" | jq -r '.id')

              # api为空直接跳过
              if [[ -z "$api_url" || "$api_url" == "null" ]];then
                echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
                continue
              fi

              # curl测速：HEAD请求，超时5s；200/301/302视为可用
              resp_code=$(curl -s -I -m 5 -o /dev/null -w "%{http_code}" "$api_url" || true)
              if [[ "$resp_code" =~ ^(200|301|302)$ ]];then
                echo "✅ [OK] id:${src_id} ${src_name} | ${api_url}"
                echo "$item" >> "$TMP_VALID"
              else
                echo "❌ [FAIL] id:${src_id} ${src_name} | code=${resp_code} ${api_url}"
              fi
          done

          # 将每行json对象重新组装成顶层数组，保持和原文件完全相同格式
          jq -s '.' "$TMP_VALID" > "$OUTPUT"
          rm -f "$TMP_VALID"

          valid_count=$(jq 'length' "$OUTPUT")
          echo "测速完成，可用源数量: ${valid_count}，输出文件: ${OUTPUT}"

      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v9
        with:
          add: VODCMSXML-YZ.json
          message: "🤖自动测速更新VODCMSXML-YZ.json $(date '+%Y-%m-%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com