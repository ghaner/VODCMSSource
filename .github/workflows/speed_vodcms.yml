name: 点播源API可用性测速(按延迟升序)
on:
  schedule:
    # UTC周五16点 = 北京时间周六 00:00
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装工具 jq curl
        run: sudo apt update && sudo apt install -y jq curl

      - name: API测速+采集延迟+按延迟升序排序
        run: |
          INPUT="VODCMSXML.json"
          OUTPUT="VODCMSXML-YZ.json"
          TMP_VALID=valid.tmp.jsonl
          rm -f "$TMP_VALID" "$OUTPUT"

          total=$(jq 'length' "$INPUT")
          echo "总源数量: $total"

          jq -c '.[]' "$INPUT" | while read -r item; do
              api_url=$(echo "$item" | jq -r '.api')
              src_name=$(echo "$item" | jq -r '.name')
              src_id=$(echo "$item" | jq -r '.id')

              if [[ -z "$api_url" || "$api_url" == "null" ]];then
                echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
                continue
              fi

              # 获取http_code + 总耗时毫秒
              result=$(curl -s -X GET -m 5 -o /dev/null -w "%{http_code} %{time_total}" "$api_url" || echo "000 5.0")
              resp_code=$(echo "$result" | awk '{print $1}')
              time_total=$(echo "$result" | awk '{print $2}')
              latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')

              if [[ "$resp_code" =~ ^(200|301|302)$ ]];then
                echo "✅ [OK] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                # 追加 latency_ms 字段，输出json行
                echo "$item" | jq --argjson lat "$latency_ms" '. + {latency_ms: $lat}' >> "$TMP_VALID"
              else
                echo "❌ [FAIL] id:${src_id} ${src_name} code=${resp_code} latency:${latency_ms}ms"
              fi
          done

          # 组装数组，按 latency_ms 升序排序（延迟小排在前面）
          jq -s 'sort_by(.latency_ms)' "$TMP_VALID" > "$OUTPUT"
          rm -f "$TMP_VALID"

          valid_count=$(jq 'length' "$OUTPUT")
          echo "测速完成，可用源数量: ${valid_count}，已按延迟升序排序，输出: ${OUTPUT}"

      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v9
        with:
          add: VODCMSXML-YZ.json
          message: "🤖测速+按延迟升序更新VODCMSXML-YZ.json $(date '+%Y-%m-%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com