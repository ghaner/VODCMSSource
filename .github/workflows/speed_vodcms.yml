name: ZY‑Player风格点播源测速(按延迟升序)
on:
  schedule:
    # UTC周五16点 = 北京时间周六00:00
    - cron: '0 16 * * 5'
  workflow_dispatch:
jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装工具 jq curl
        run: sudo apt update && sudo apt install -y jq curl
      - name: 2.1 VODCMSXML.json格式化｜api链接去重输出VODCMSXMLcs.json
        run: |
          INPUT_RAW="VODCMSXML.json"
          TMP_CS="VODCMSXMLcs.json"
          rm -f "$TMP_CS"
          jq '
            # 不再移除api末尾斜杠，保留原始url原样；直接按原始api精确去重
            reduce .[] as $item (
              [];
              if any(.[]; .api == $item.api) then . else . + [$item] end
            )
          ' "$INPUT_RAW" > "$TMP_CS"
          total_input=$(jq 'length' "$TMP_CS")
          echo "【2.1格式化完成】去重后源总数：${total_input}，输出临时文件：${TMP_CS}"

      - name: 2.2‑A 普通源测速｜排除Chrome‑UAXML白名单链接，默认UA测速
        run: |
          set -euo pipefail
          TMP_CS="VODCMSXMLcs.json"
          OUT_JSONL="speed_normal.tmp.jsonl"
          RESP_TMP="resp_normal.tmp.raw"
          WHITELIST_FILE="./Chrome‑UAXML.txt"
          DEFAULT_UA="Mozilla/5.0 (X11; Linux x86_64) curl-githubaction"

          #加载白名单api存入数组
          WHITELIST_API=()
          if [[ -f "${WHITELIST_FILE}" ]];then
            while IFS= read -r line; do
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              WHITELIST_API+=("$line")
            done < "${WHITELIST_FILE}"
          fi

          is_in_whitelist(){
            local target="$1"
            for item in "${WHITELIST_API[@]}";do
              [[ "${item}" == "${target}" ]] && return 0
            done
            return 1
          }

          rm -f "${OUT_JSONL}" "${RESP_TMP}"
          touch "${OUT_JSONL}"

          jq -c '.[]' "${TMP_CS}" | while IFS= read -r item; do
            api_url=$(echo "$item" | jq -r '.api')
            src_name=$(echo "$item" | jq -r '.name')
            src_id=$(echo "$item" | jq -r '.id')
            rm -f "${RESP_TMP}"

            #白名单链接直接跳过，留给2.2‑B处理
            if is_in_whitelist "${api_url}";then
              continue
            fi
            if [[ -z "$api_url" || "$api_url" == "null" ]];then
              echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
              continue
            fi

            curl_args=("-s" "-X" "GET" "-L" "-m" "5" "-o" "${RESP_TMP}" "-w" "%{http_code} %{time_total}" "-A" "${DEFAULT_UA}")
            result=$(curl "${curl_args[@]}" "${api_url}" || echo "000 5.0")
            resp_code=$(echo "$result" | awk '{print $1}')
            time_total=$(echo "$result" | awk '{print $2}')
            latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')

            if [[ "${resp_code}" == "000" ]];then
              echo "❌[网络失败] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
              continue
            fi
            if [[ ! "${resp_code}" =~ ^(200|301|302)$ ]];then
              echo "❌[HTTP异常 ${resp_code}] id:${src_id} ${src_name} latency:${latency_ms}ms"
              continue
            fi
            if grep -iq "<html" "${RESP_TMP}";then
              echo "❌[解析失败：返回HTML风控页面] id:${src_id} ${src_name} latency:${latency_ms}ms"
              continue
            fi

            #文本特征判断XML / JSON，彻底移除xmllint，消除外部程序退出码陷阱
            is_valid_content=0
            if grep -qE '<?xml|<rss|<list' "${RESP_TMP}" 2>/dev/null;then
              is_valid_content=1
            elif jq empty "${RESP_TMP}" 2>/dev/null;then
              is_valid_content=1
            fi

            if [[ $is_valid_content -eq 1 ]];then
              echo "✅[普通源可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
              line=$(echo "$item" | jq -c --argjson lat "${latency_ms}" '. + {latency_ms:$lat}' 2>/dev/null)
              if [[ $? -eq 0 && -n "${line}" ]];then
                echo "${line}" >> "${OUT_JSONL}"
              fi
            else
              echo "❌[解析失败：返回非点播XML/JSON数据] id:${src_id} ${src_name} latency:${latency_ms}ms"
            fi
          done
          echo "【2.2‑A普通测速完成】普通源有效记录行数：$(wc -l < ${OUT_JSONL})"

      - name: 2.2‑B ChromeUA专属测速｜仅处理Chrome‑UAXML.txt清单内链接
        run: |
          set -euo pipefail
          TMP_CS="VODCMSXMLcs.json"
          OUT_JSONL="speed_chrome.tmp.jsonl"
          RESP_TMP="resp_chrome.tmp.raw"
          WHITELIST_FILE="./Chrome‑UAXML.txt"
          CHROME_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          rm -f "${OUT_JSONL}" "${RESP_TMP}"
          touch "${OUT_JSONL}"

          if [[ ! -f "${WHITELIST_FILE}" ]];then
            echo "ℹ️ Chrome‑UAXML.txt不存在，跳过ChromeUA测速步骤"
            exit 0
          fi

          #读取白名单api集合
          WHITELIST_API=()
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            WHITELIST_API+=("$line")
          done < "${WHITELIST_FILE}"

          #循环白名单内每一条api，从VODCMSXMLcs.json取出完整源对象测速
          for target_api in "${WHITELIST_API[@]}";do
            item=$(jq -c --arg api "${target_api}" '.[] | select(.api == $api)' "${TMP_CS}")
            if [[ -z "${item}" ]];then
              echo "⚠️白名单api:${target_api} 在VODCMSXMLcs.json找不到对应源，跳过"
              continue
            fi
            api_url=$(echo "$item" | jq -r '.api')
            src_name=$(echo "$item" | jq -r '.name')
            src_id=$(echo "$item" | jq -r '.id')
            rm -f "${RESP_TMP}"

            curl_args=("-s" "-X" "GET" "-L" "-m" "5" "-o" "${RESP_TMP}" "-w" "%{http_code} %{time_total}" "-A" "${CHROME_UA}")
            result=$(curl "${curl_args[@]}" "${api_url}" || echo "000 5.0")
            resp_code=$(echo "$result" | awk '{print $1}')
            time_total=$(echo "$result" | awk '{print $2}')
            latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')

            if [[ "${resp_code}" == "000" ]];then
              echo "❌[ChromeUA网络失败] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
              continue
            fi
            if [[ ! "${resp_code}" =~ ^(200|301|302)$ ]];then
              echo "❌[ChromeUA‑HTTP异常 ${resp_code}] id:${src_id} ${src_name} latency:${latency_ms}ms"
              continue
            fi
            if grep -iq "<html" "${RESP_TMP}";then
              echo "❌[ChromeUA解析失败：返回HTML风控页面] id:${src_id} ${src_name} latency:${latency_ms}ms"
              continue
            fi

            is_valid_content=0
            if grep -qE '<?xml|<rss|<list' "${RESP_TMP}" 2>/dev/null;then
              is_valid_content=1
            elif jq empty "${RESP_TMP}" 2>/dev/null;then
              is_valid_content=1
            fi

            if [[ $is_valid_content -eq 1 ]];then
              echo "✅[ChromeUA源可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
              line=$(echo "$item" | jq -c --argjson lat "${latency_ms}" '. + {latency_ms:$lat}' 2>/dev/null)
              if [[ $? -eq 0 && -n "${line}" ]];then
                echo "${line}" >> "${OUT_JSONL}"
              fi
            else
              echo "❌[ChromeUA解析失败：返回非点播XML/JSON数据] id:${src_id} ${src_name} latency:${latency_ms}ms"
            fi
          done
          echo "【2.2‑B ChromeUA测速完成】Chrome源有效记录行数：$(wc -l < ${OUT_JSONL})"

      - name: 2.2‑C 合并普通+ChromeUA测速结果输出VODCMSXMLyx.json
        run: |
          set -euo pipefail
          TMP_YX_RAW="VODCMSXMLyx.json"
          NORMAL_JSONL="speed_normal.tmp.jsonl"
          CHROME_JSONL="speed_chrome.tmp.jsonl"
          rm -f "${TMP_YX_RAW}"
          #合并两份jsonl
          cat "${NORMAL_JSONL}" "${CHROME_JSONL}" | jq -s '.' > "${TMP_YX_RAW}"
          valid_total=$(jq 'length' "${TMP_YX_RAW}")
          echo "【2.2‑C合并完成】全部测速成功源总数：${valid_total}，输出：${TMP_YX_RAW}"
          #清理中间jsonl临时文件
          rm -f "${NORMAL_JSONL}" "${CHROME_JSONL}" resp_normal.tmp.raw resp_chrome.tmp.raw

      - name: 2.3 测速结果处理｜重命名name、排序、分配id、字段赋值，输出VODCMSXML‑YZ.json
        run: |
          TMP_YX_RAW="VODCMSXMLyx.json"
          OUTPUT="VODCMSXML-YZ.json"
          rm -f "$OUTPUT"
          jq '
            # 2.3.1 点播源数组按照测速延迟升序排列
            sort_by(.latency_ms)
            # 预提取云播组延迟最小对象
            | map(select(.group=="云播")) as $yunGroup
            | ($yunGroup | if length>0 then sort_by(.latency_ms)[0] else null end) as $yunMinObj
            # 2.3.2 name相同、api不同，name追加二级域名主体不带后缀
            | group_by(.name)
            | map(
                . as $grp
                | ($grp | map(.api)|unique|length) as $apiCnt
                | if $apiCnt <= 1 then
                    $grp
                  else
                    $grp | map(
                      .api as $apiStr
                      | if ($apiStr | type) != "string" then .
                      else
                        ($apiStr | capture("^https?://(?<host>[^/]+)").host?) as $h
                        | ($h | split(".")) as $parts
                        | if ($parts | length) >= 2 then
                            .name = "\(.name)-\($parts[-2])"
                          else
                            .name = "\(.name)-unknown"
                          end
                      end
                    )
                  end
              )
            | flatten
            # 统一状态字段
            | map(.isActive = true | .status = "可用")
            # 云播最小源置顶；其余保留测速升序排在后面；无云播则维持原排序
            | if $yunMinObj != null then
                [ $yunMinObj ] + ( . | map(select(.api != $yunMinObj.api)) )
              else
                .
              end
            # 分配id：置顶项id=1，往下依次2,3,4…，删除latency_ms
            | to_entries
            | map( .value + {id:(.key + 1)} | del(.latency_ms) )
          ' "$TMP_YX_RAW" > "$OUTPUT"
          final_count=$(jq 'length' "$OUTPUT")
          echo "【2.3结果处理完成】最终可用源数量: ${final_count}，输出：${OUTPUT}"
          # 清理全部临时文件
          rm -f VODCMSXMLcs.json VODCMSXMLyx.json

      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v11
        with:
          add: VODCMSXML-YZ.json
          message: "🤖ZY‑Player风格测速更新VODCMSXML‑YZ.json $(date '+%Y‑%m‑%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com
          pull: true