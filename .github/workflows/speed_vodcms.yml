name: ZY‑Player风格点播源测速(按延迟升序)
on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:
jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 安装工具 jq curl
        run: sudo apt update && sudo apt install -y jq curl libxml2-utils
      - name: ZY‑Player逻辑测速，校验内容有效性，采集延迟排序
        run: |
          INPUT="VODCMSXML.json"
          INPUT_DEDUP="VODCMSXML-dedup.tmp.json"
          OUTPUT="VODCMSXML-YZ.json"
          TMP_VALID=valid.tmp.jsonl
          RESP_TMP=resp.tmp.raw

          rm -f "$TMP_VALID" "$OUTPUT" "$RESP_TMP" "$INPUT_DEDUP"

          jq '
            reduce .[] as $item (
              [];
              if any(.[]; .api == $item.api) then . else . + [$item] end
            )
          ' "$INPUT" > "$INPUT_DEDUP"

          total=$(jq 'length' "$INPUT_DEDUP")
          echo "【ZY‑Player模拟测速】总源数量(去重后): $total"

          jq -c '.[]' "$INPUT_DEDUP" | while read -r item; do
              api_url=$(echo "$item" | jq -r '.api')
              src_name=$(echo "$item" | jq -r '.name')
              src_id=$(echo "$item" | jq -r '.id')
              rm -f "$RESP_TMP"
              if [[ -z "$api_url" || "$api_url" == "null" ]];then
                echo "⚠️ id:${src_id} ${src_name} api链接为空，跳过"
                continue
              fi
              result=$(curl -s -X GET -L -m 5 -o "$RESP_TMP" -w "%{http_code} %{time_total}" "$api_url" || echo "000 5.0")
              resp_code=$(echo "$result" | awk '{print $1}')
              time_total=$(echo "$result" | awk '{print $2}')
              latency_ms=$(awk -v t="$time_total" 'BEGIN{printf "%.0f", t*1000}')

              if [[ "$resp_code" == "000" ]];then
                echo "❌[网络失败] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                continue
              fi
              if [[ ! "$resp_code" =~ ^(200|301|302)$ ]];then
                echo "❌[HTTP异常 ${resp_code}] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi
              if grep -iq "<html" "$RESP_TMP";then
                echo "❌[解析失败：返回HTML风控页面] id:${src_id} ${src_name} latency:${latency_ms}ms"
                continue
              fi

              is_valid_content=0
              if xmllint --noout "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              elif jq empty "$RESP_TMP" 2>/dev/null;then
                  is_valid_content=1
              fi

              if [[ $is_valid_content -eq 1 ]];then
                echo "✅[可用] id:${src_id} ${src_name} latency:${latency_ms}ms | ${api_url}"
                # 测速阶段保存原始name + api，同时计算并保存 _d2_body；不修改name
                echo "$item" | jq --argjson lat "$latency_ms" '
                def getSecondDomainBody:
                  (.api|type) as $t
                  | if $t!="string" then "unknown"
                  else
                    (.api | capture("^https?://(?<host>[^/]+)") | .host // null) as $h
                    | if $h==null then "unknown" else ($h | split(".") | if length>=2 then .[-2] else $h end) end
                  end;
                . + {latency_ms:$lat, _d2_body:getSecondDomainBody, isActive:true, status:"可用"}
                ' >> "$TMP_VALID"
              else
                echo "❌[解析失败：返回非点播XML/JSON数据] id:${src_id} ${src_name} latency:${latency_ms}ms"
              fi
          done

          # =========测速完成，全部可用源读入内存；【全部逻辑封闭在这一段jq内部，不往外传shell变量】=========
          jq -s '
            map(select(type=="object")) as $allValid
            # 在jq内部，基于【测速存活的可用源】计算冲突name数组，不需要shell！
            | ($allValid | group_by(.name) | map( {name:.[0].name, cnt:length} ) | map(select(.cnt>1)|.name)) as $conflict_names

            | $allValid as $all
            | ($all | map(select(.group=="云播")) | sort_by(.latency_ms)) as $yunList
            | if ($yunList|length>0) then
                [$yunList[0]] + ($all | map(select(.id != $yunList[0].id)) | sort_by(.latency_ms))
              else
                $all | sort_by(.latency_ms)
              end
            # 使用本jq脚本内部定义好的$conflict_names数组，条件改名
            | map(
                if ($conflict_names | index(.name)) then
                    .name = "\(.name)-\(._d2_body)"
                else . end
                | del(._d2_body, .latency_ms)
            )
            | to_entries
            | map(.value + {id:(.key+1)})
          ' "$TMP_VALID" > "$OUTPUT"

          rm -f "$TMP_VALID" "$RESP_TMP" "$INPUT_DEDUP"
          valid_count=$(jq 'length' "$OUTPUT")
          echo "测速结束，可用源数量: ${valid_count}，输出文件：${OUTPUT}"
      - name: 提交更新结果文件
        uses: EndBug/add-and-commit@v11
        with:
          add: VODCMSXML-YZ.json
          message: "🤖ZY‑Player风格测速更新VODCMSXML‑YZ.json $(date '+%Y‑%m‑%d %H:%M')"
          committer_name: Github‑Action
          committer_email: action@github.com
          pull: true