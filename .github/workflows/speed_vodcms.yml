name: 点播源自动测速

on:
  # 定时触发：每周六 0 点（UTC 时间，对应北京时间 08:00，如需北京时间 0 点请改为 16,*,*,6,0）
  schedule:
    - cron: '0 0 * * 6'
  # 允许手动触发测试
  workflow_dispatch:

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y curl jq

      - name: 执行源测速并生成可用源文件
        run: |
          # 定义输入/输出文件
          INPUT_FILE="VODCMSXML.json"
          OUTPUT_FILE="VODCMSXML-YZ.json"
          
          # 测速函数（检测视频流可访问性）
          speed_test() {
            local url="$1"
            if [[ -z "$url" ]]; then return 1; fi
            # 只请求头，超时 3 秒，状态码 200/302 视为有效
            curl -s -I -m 3 -o /dev/null -w "%{http_code}" "$url" | grep -qE '200|302'
            return $?
          }
          
          # 读取源列表并测速
          echo "开始测速，共 $(jq '.channels | length' $INPUT_FILE) 个源"
          jq -c '.channels[]' $INPUT_FILE | while read -r channel; do
            url=$(echo "$channel" | jq -r '.url')
            name=$(echo "$channel" | jq -r '.name')
            
            if speed_test "$url"; then
              echo "✅ 可用：$name"
              echo "$channel" >> valid_channels.tmp
            else
              echo "❌ 失效：$name"
            fi
          done
          
          # 生成最终 JSON 文件
          jq -n '{
              "update_time": "'$(date -Iseconds)'",
              "count": $(wc -l < valid_channels.tmp),
              "channels": [inputs]
          }' valid_channels.tmp > $OUTPUT_FILE
          
          # 清理临时文件
          rm -f valid_channels.tmp
          echo "测速完成！有效源已保存到 $OUTPUT_FILE"

      - name: 提交并推送结果
        uses: EndBug/add-and-commit@v9
        with:
          message: '✅ 自动测速：更新可用点播源'
          add: 'VODCMSXML-YZ.json'
          committer_name: GitHub Actions
          committer_email: actions@github.com